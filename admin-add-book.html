<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add New Book | Admin</title>

    <link rel="stylesheet" href="css/admin.css">

</head>

<body>

    <!-- ADMIN NAVBAR -->

    <header class="admin-navbar">

        <!-- LOGO -->

        <div class="admin-logo">
            <img src="assets/images/logo.png" alt="Logo">
        </div>


        <!-- NAVIGATION -->

        <nav class="admin-nav" id="adminNav">

            <a href="admin.html">
                Dashboard
            </a>

            <a href="admin-manage-books.html">
                Books
            </a>

            <a href="admin-add-book.html">
                Add New
            </a>

            <a href="#" onclick="logoutUser()">
                Logout
            </a>

        </nav>


        <!-- RIGHT SIDE -->

        <div class="admin-nav-actions">

            <!-- THEME -->

            <button id="adminThemeBtn" class="theme-btn" type="button">
                🌙
            </button>


            <!-- MOBILE MENU -->

            <button id="adminMenuBtn" class="admin-menu-btn" type="button">
                ☰
            </button>

        </div>

    </header>


    <!-- MAIN -->

    <main class="admin-books-page">

        <!-- PAGE HEADER -->

        <div class="admin-books-header">

            <p class="admin-small-title">
                ADMIN PANEL
            </p>

            <h1>
                Add New Book
            </h1>

            <p>
                Add a new digital book to the library.
            </p>

        </div>


        <!-- ADD BOOK FORM -->

        <section class="add-book-section">

            <h2 id="formTitle">
                ➕ Add New Book
            </h2>


            <form id="addBookForm" enctype="multipart/form-data">


                <!-- TITLE + AUTHOR -->

                <div class="form-row">

                    <div class="form-group">

                        <label for="title">
                            Book Title
                        </label>

                        <input type="text" id="title" placeholder="Enter book title" required>

                    </div>


                    <div class="form-group">

                        <label for="author">
                            Author
                        </label>

                        <input type="text" id="author" placeholder="Enter author name" required>

                    </div>

                </div>


                <!-- CATEGORY + YEAR -->

                <div class="form-row">

                    <div class="form-group">

                        <label for="category">
                            Category
                        </label>

                        <select id="category" required>

                            <option value="">
                                Select Category
                            </option>

                            <option value="Tamil">Tamil</option>
                            <option value="English">English</option>
                            <option value="Mathematics">Mathematics</option>
                            <option value="Physics">Physics</option>
                            <option value="Chemistry">Chemistry</option>
                            <option value="Botany">Botany</option>
                            <option value="Zoology">Zoology</option>
                            <option value="Computer Science">Computer Science</option>
                            <option value="Artificial Intelligence">Artificial Intelligence</option>
                            <option value="Data Science">Data Science</option>
                            <option value="Data Structures">Data Structures</option>
                            <option value="Networking">Networking</option>
                            <option value="Database">Database</option>
                            <option value="Web Development">Web Development</option>
                            <option value="Programming">Programming</option>
                            <option value="Cyber Security">Cyber Security</option>
                            <option value="Cloud Computing">Cloud Computing</option>
                            <option value="Operating Systems">Operating Systems</option>
                            <option value="Software Engineering">Software Engineering</option>
                            <option value="Mobile Development">Mobile Development</option>
                            <option value="Novels">Novels</option>
                            <option value="Short Stories">Short Stories</option>
                            <option value="History">History</option>
                            <option value="Geography">Geography</option>
                            <option value="Economics">Economics</option>
                            <option value="Commerce">Commerce</option>
                            <option value="Management">Management</option>
                            <option value="Psychology">Psychology</option>
                            <option value="Self Development">Self Development</option>
                            <option value="Competitive Exams">Competitive Exams</option>
                            <option value="General Knowledge">General Knowledge</option>

                        </select>

                    </div>


                    <div class="form-group">

                        <label for="year">
                            Published Year
                        </label>

                        <input type="number" id="year" placeholder="2026" min="1900" max="2100" required>

                    </div>

                </div>


                <!-- PAGES + RATING -->

                <div class="form-row">

                    <div class="form-group">

                        <label for="pages">
                            Pages
                        </label>

                        <input type="number" id="pages" placeholder="Enter number of pages" min="1" required>

                    </div>


                    <div class="form-group">

                        <label for="rating">
                            Rating
                        </label>

                        <input type="number" id="rating" step="0.1" min="0" max="5" placeholder="4.5" required>

                    </div>

                </div>


                <!-- COVER + PDF -->

                <div class="form-row">

                    <div class="form-group">

                        <label for="coverImage">
                            🖼️ Cover Image
                        </label>

                        <input type="file" id="coverImage" accept="image/jpeg,image/png,image/jpg,image/webp">

                        <small id="coverHint">
                            Required for new book
                        </small>

                    </div>


                    <div class="form-group">

                        <label for="bookPdf">
                            📄 Book PDF
                        </label>

                        <input type="file" id="bookPdf" accept=".pdf,application/pdf">

                        <small id="pdfHint">
                            Required for new book
                        </small>

                    </div>

                </div>


                <!-- DESCRIPTION -->

                <div class="form-group">

                    <label for="description">
                        Description
                    </label>

                    <textarea id="description" rows="5" placeholder="Enter book description" required></textarea>

                </div>


                <!-- BUTTON -->

                <div class="admin-form-actions">

                    <button type="submit" class="admin-submit-btn" id="submitBookBtn">

                        ➕ Add Book

                    </button>

                </div>


            </form>

        </section>

    </main>


    <!-- FOOTER -->

    <footer class="admin-footer">

        <p>
            © 2026 Digital Library Management System
        </p>

        <p>
            Admin Panel
        </p>

    </footer>


    <script src="js/app.js"></script>

    <script src="js/admin-books.js"></script>

</body>

</html>
